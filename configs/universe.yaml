# ETF universe, maintained by hand.
#
# Why by hand: free sources have no authoritative ETF -> tracked-index field.
# Every mapping is validated against 60-day return correlation (>0.95) at load
# time when index data is available.
#
# flow_sectors maps an ETF to THS industry names (our working fund-flow source
# after the Eastmoney push2 endpoints became unreachable). Broad-based ETFs
# have no flow mapping; they inherit market-level flow instead.
#
# How this list was built (u2, 2026-11-05): scripts/screen_universe.py takes the
# day's spot snapshot, keeps turnover >= 1亿 and >= 250 trading days of history,
# drops one product per index family and one per 60-day return correlation
# cluster (>=0.99), then fills the category quotas below. Four near-duplicates
# were pruned and four hand-picked sectors added during review.
#
# effective_from for screened entries is the first date in our price history
# (2022-01-04 when the ETF predates it), i.e. a lower bound on the listing date.
# index_data: false means we do not chase a tracked-index series for that ETF;
# the factor kernel only needs ETF prices.

