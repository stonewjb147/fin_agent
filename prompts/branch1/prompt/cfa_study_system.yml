knowledge_qa: |
  【任务】CFA知识点精准问答

  请根据以下检索到的CFA知识库内容，回答用户的知识点问题。

  【回答要求 - 三层响应模型】
  根据问题的复杂度，自动选择回答深度：

  🔹 第1层：精准定义（必答）
  - 给出知识点的标准定义（对标CFA官方教材）
  - 标注所属科目、章节、LOS编号
  - 如有公式，使用LaTeX格式：$公式$，并解释每个变量含义

  🔹 第2层：深度理解（当问题涉及“为什么”或“解释”时回答）
  - 解释该知识点的经济学/金融学直觉
  - 说明该知识点在CFA体系中的位置（前置知识+后续关联）
  - 提供推导逻辑或思维导图式讲解

  🔹 第3层：应用实操（当问题涉及“计算”或“应用”时回答）
  - 给出一个典型计算例题（含分步详解）
  - 标注常见错误和易混淆点
  - 说明在真实金融场景中的应用

  注意：
  - 简单概念只需第1层
  - 复杂分析需要3层全覆盖
  - 若知识库未覆盖，必须声明“该知识点暂未收录在我的CFA知识库中”

  【检索到的CFA知识库内容】
  {context}

  【用户问题】
  {question}

  请按以下格式输出：

  ## 知识点定位
  - 科目：[例如：权益投资/固定收益/公司金融等]
  - 章节：[例如：Reading 30]
  - LOS编号：[例如：CFA L2-Equity-Reading 30.a]
  - 难度级别：[CFA一级/二级/三级]

  ## 核心定义
  （精准定义+公式，公式用$包裹）

  ## 深度解读
  （如有需要，解释直觉和推导逻辑）

  ## 应用示例
  （如有需要，含分步详解和常见错误）

  ## 关联知识点
  （前置知识和后续关联的LOS编号）
  
  ## 原版书课后知识点相关的习题
     提供原版书知识点相关的例题并解答

chapter_summary: |
  【任务】CFA章节考点总结

  请根据检索到的CFA知识库内容，为用户总结指定章节的核心考点。

  【总结要求】
  1. 考点地图：按考试权重排序（重点→次重点→了解即可），标注重要性和难度
  2. 重难点精讲：用通俗语言解释最难的3个知识点（费曼学习法）
  3. 知识框架：用文字版思维导图展示本章结构
  4. 典型例题：提供2道最具代表性的题目（含详解）
  5. 避坑指南：列出考生最常犯的5个错误

  【检索到的CFA知识库内容】
  {context}

  【章节请求】
  {chapter_request}

  请按以下格式输出：

  # {{chapter_name}} - 考点总结

  ## 一、考点地图（按重要性排列）
  | 考点 | 重要性 | 难度 | 常见题型 | LOS编号 |
  |------|--------|------|---------|---------|
  | ... | ★★★★★ | 高 | 计算题 | ... |

  ## 二、重难点精讲
  ### 难点1：{{考点名称}}
  - 一句话理解：
  - 详细解释：
  - 记忆技巧：

  ## 三、知识框架图
  （文字版思维导图）

  ## 四、典型例题
  ### 例题1
  - 题目：
  - 解析：
  - 答案：

  ## 五、避坑指南
  1. ...
  2. ...

  ## 六、本章在CFA体系中的位置
  - 前置知识：
  - 后续关联：